name: Validate native dependencies

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "eng/native/native-dependencies.json"
      - "eng/native/windows-shared-media/**"
      - "eng/Build-WindowsSharedMediaStack.ps1"
      - "eng/Prepare-LinuxReleasePayload.sh"
      - "eng/Install-LinuxBuildDependencies.sh"

permissions:
  contents: read

jobs:
  pins:
    name: Validate dependency pins
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Validate manifests and source locks
        shell: pwsh
        run: ./eng/Test-NativeDependencies.ps1

  windows:
    name: Build Windows native payload
    needs: pins
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      WINDOWS_NATIVE_CACHE: ${{ github.workspace }}/.native-cache/windows-x64
      WINEDEBUG: "-all"
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/swift
          df -h /
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: .native-cache/windows-x64
          key: windows-native-v2-${{ hashFiles('eng/native/native-dependencies.json', 'eng/native/windows-shared-media/**') }}
          restore-keys: windows-native-v2-
      - name: Install Windows-binary validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wine64
      - name: Build and validate native media stack
        shell: pwsh
        run: ./eng/Build-WindowsSharedMediaStack.ps1 -CachePath "$env:WINDOWS_NATIVE_CACHE"

  linux:
    name: Build Linux native payload
    needs: pins
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      CLIPEDIT_LINUX_NATIVE_BUILD_ROOT: ${{ github.workspace }}/.native-cache/linux-x64
      CLIPEDIT_ENABLE_SOURCE_REPOSITORIES: "1"
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/swift
          df -h /
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: .native-cache/linux-x64
          key: linux-native-v2-${{ hashFiles('eng/native/native-dependencies.json', 'eng/Prepare-LinuxReleasePayload.sh', 'eng/Install-LinuxBuildDependencies.sh') }}
          restore-keys: linux-native-v2-
      - name: Install native build dependencies
        run: ./eng/Install-LinuxBuildDependencies.sh
      - name: Build and validate native media stack
        shell: pwsh
        run: ./eng/Prepare-ReleasePayload.ps1 -RuntimeId linux-x64
