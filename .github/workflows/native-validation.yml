name: Validate native dependencies

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "eng/native/native-dependencies.json"
      - "eng/Build-WindowsSharedMediaStack.ps1"
      - "eng/Export-WindowsCorrespondingSource.ps1"
      - "eng/Prepare-ReleasePayload.ps1"
      - "eng/Prepare-LinuxReleasePayload.sh"
      - "eng/Install-LinuxBuildDependencies.sh"

permissions:
  contents: read

jobs:
  pins:
    name: Validate dependency pins
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Validate manifests and source locks
        shell: pwsh
        run: ./eng/Test-NativeDependencies.ps1

  windows:
    name: Assemble Windows native payload
    needs: pins
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf input
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-mpv
            tar
            zstd
      - name: Assemble and validate media stack
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: ./eng/Build-WindowsSharedMediaStack.ps1
      - name: Restore corresponding-source cache
        uses: actions/cache@v5
        with:
          path: packages/native/source-cache/win-x64
          key: windows-native-sources-v2-${{ hashFiles('eng/native/native-dependencies.json', 'eng/Export-WindowsCorrespondingSource.ps1') }}
          restore-keys: windows-native-sources-v2-
      - name: Assemble payload and export corresponding source
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          ./eng/Prepare-ReleasePayload.ps1 -RuntimeId win-x64
          ./eng/Export-WindowsCorrespondingSource.ps1

  linux:
    name: Build Linux native payload
    needs: pins
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      CLIPEDIT_LINUX_NATIVE_BUILD_ROOT: ${{ github.workspace }}/.native-cache/linux-x64
      CLIPEDIT_ENABLE_SOURCE_REPOSITORIES: "1"
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/swift
          df -h /
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: .native-cache/linux-x64
          key: linux-native-v2-${{ hashFiles('eng/native/native-dependencies.json', 'eng/Prepare-LinuxReleasePayload.sh', 'eng/Install-LinuxBuildDependencies.sh') }}
          restore-keys: linux-native-v2-
      - name: Install native build dependencies
        run: ./eng/Install-LinuxBuildDependencies.sh
      - name: Build and validate native media stack
        shell: pwsh
        run: ./eng/Prepare-ReleasePayload.ps1 -RuntimeId linux-x64
