name: Check native dependencies

on:
  workflow_dispatch:
    inputs:
      create_pull_request:
        description: "Create a draft PR for safe pin updates"
        required: true
        default: true
        type: boolean

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  check:
    name: Review upstream native versions
    runs-on: windows-2025
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf input
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@v5
        with:
          path: packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'NuGet.Config', '**/*.csproj') }}
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
      - name: Check upstream versions
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          ./eng/Update-NativeDependencies.ps1 -ReportPath artifacts/native-dependency-report.md
          Get-Content artifacts/native-dependency-report.md | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Apply safe pin updates
        if: inputs.create_pull_request
        id: update
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          ./eng/Update-NativeDependencies.ps1 -Apply -ReportPath artifacts/native-dependency-report.md
          ./eng/Test-NativeDependencies.ps1
          git diff --quiet -- eng/native
          if ($LASTEXITCODE -eq 0) {
              "changed=false" | Add-Content $env:GITHUB_OUTPUT
              "No safely automated native pin updates were found." | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          elseif ($LASTEXITCODE -eq 1) {
              "changed=true" | Add-Content $env:GITHUB_OUTPUT
          }
          else {
              throw "git diff failed with exit code $LASTEXITCODE."
          }
      - name: Test updated source tree
        if: steps.update.outputs.changed == 'true'
        run: |
          dotnet restore ClipEdit.sln
          dotnet test ClipEdit.sln --no-restore --configuration Release
      - name: Push dependency branch
        if: steps.update.outputs.changed == 'true'
        id: branch
        shell: bash
        run: |
          branch="automation/native-dependencies-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- eng/native
          git commit -m "build(native): update reviewed dependency pins"
          git push --set-upstream origin "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
      - name: Open draft pull request
        if: steps.update.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          body_path="$RUNNER_TEMP/native-dependency-pr.md"
          {
            echo "This draft was generated by the manually dispatched native dependency review."
            echo
            cat artifacts/native-dependency-report.md
            echo
            echo "Windows uses reviewed MSYS2 UCRT64 package versions. Native validation must assemble the complete DLL closure and pass the codec, format, filter, shared-libav, and corresponding-source checks before this PR is merged."
            echo
            echo "The native validation workflow will build both platform payloads for this PR."
          } > "$body_path"
          args=(
            pr create
            --draft
            --base "$BASE_BRANCH"
            --head "$BRANCH"
            --title "build(native): update reviewed dependency pins"
            --body-file "$body_path"
          )
          if ! url="$(gh "${args[@]}")"; then
            echo "GitHub could not create the PR. Ensure Settings > Actions > General allows Actions to create pull requests." >&2
            exit 1
          fi
          echo "Draft pull request: $url" >> "$GITHUB_STEP_SUMMARY"
          gh workflow run native-validation.yml --ref "$BRANCH"
          echo "Windows and Linux native validation was dispatched for $BRANCH." >> "$GITHUB_STEP_SUMMARY"
